# TrackRat Webpage Staging Deployment
# Triggered by push to 'main' branch (path filter: webpage_v2/**)
# Builds the React app pointing at staging API, deploys to Cloudflare Workers
# Static Assets (Worker `trackrat-webpage-staging`, serving staging.trackrat.net)
#
# Serving policy (cache headers, HSTS, the AASA content type) is NOT set here
# any more — it lives in webpage_v2/public/_headers, which Vite copies to the
# dist root and Cloudflare parses on upload. The SPA fallback comes from
# `assets.not_found_handling` in webpage_v2/wrangler.jsonc. See issue #1713.

substitutions:
  _API_BASE_URL: 'https://staging-api.trackrat.net/api/v2'

steps:
  # Install dependencies
  - name: 'node:22'
    id: 'install'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['ci']

  # Run tests
  - name: 'node:22'
    id: 'test'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['test']
    waitFor: ['install']

  # Build with staging API URL
  - name: 'node:22'
    id: 'build'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_BASE_URL=${_API_BASE_URL}'
    waitFor: ['test']

  # Upload dist/ as the Worker's static assets.
  #
  # Target Worker name and custom domain both come from the `staging`
  # environment in webpage_v2/wrangler.jsonc, so the destination is declared in
  # version control rather than in flags — nothing here can be pointed
  # somewhere else by editing the pipeline alone.
  #
  # `npx wrangler` resolves the version pinned in webpage_v2/package.json and
  # installed by the `install` step above (Cloud Build steps share /workspace).
  # Deliberately not `wrangler@latest`: an unpinned deploy tool means the
  # deployment path can change without a commit.
  - name: 'node:22'
    id: 'deploy'
    dir: 'webpage_v2'
    entrypoint: 'npx'
    args: ['wrangler', 'deploy', '--env', 'staging']
    secretEnv: ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']
    waitFor: ['build']

availableSecrets:
  secretManager:
    - versionName: projects/trackrat-v2/secrets/cloudflare-workers-api-token/versions/latest
      env: 'CLOUDFLARE_API_TOKEN'
    - versionName: projects/trackrat-v2/secrets/cloudflare-account-id/versions/latest
      env: 'CLOUDFLARE_ACCOUNT_ID'

tags:
  - 'trackrat'
  - 'webpage'
  - 'staging'

options:
  logging: CLOUD_LOGGING_ONLY
