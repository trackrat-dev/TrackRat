# TrackRat Webpage Production Deployment
# Triggered by push to 'production' branch (path filter: webpage_v2/**)
# Builds the React app pointing at production API, deploys to Cloudflare Workers
# Static Assets (Worker `trackrat-webpage-production`, serving trackrat.net and
# www.trackrat.net)
#
# Serving policy (cache headers, HSTS, the AASA content type) is NOT set here
# any more — it lives in webpage_v2/public/_headers, which Vite copies to the
# dist root and Cloudflare parses on upload. The SPA fallback comes from
# `assets.not_found_handling` in webpage_v2/wrangler.jsonc. See issue #1713.
#
# This used to deploy to the trackrat-webpage-production GCS bucket as well,
# for the DNS cutover window. Nothing has served that bucket since 2026-08-08,
# so the gsutil steps were removed (issue #1763).

substitutions:
  _API_BASE_URL: 'https://apiv2.trackrat.net/api/v2'

steps:
  # Install dependencies
  - name: 'node:22'
    id: 'install'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['ci']

  # Run tests
  - name: 'node:22'
    id: 'test'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['test']
    waitFor: ['install']

  # Build with production API URL
  - name: 'node:22'
    id: 'build'
    dir: 'webpage_v2'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      - 'VITE_API_BASE_URL=${_API_BASE_URL}'
    waitFor: ['test']

  # Upload dist/ as the Worker's static assets. The Worker name and the
  # trackrat.net / www custom domains come from the `production` environment in
  # webpage_v2/wrangler.jsonc.
  - name: 'node:22'
    id: 'deploy-worker'
    dir: 'webpage_v2'
    entrypoint: 'npx'
    args: ['wrangler', 'deploy', '--env', 'production']
    secretEnv: ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']
    waitFor: ['build']

availableSecrets:
  secretManager:
    - versionName: projects/trackrat-v2/secrets/cloudflare-workers-api-token/versions/latest
      env: 'CLOUDFLARE_API_TOKEN'
    - versionName: projects/trackrat-v2/secrets/cloudflare-account-id/versions/latest
      env: 'CLOUDFLARE_ACCOUNT_ID'

tags:
  - 'trackrat'
  - 'webpage'
  - 'production'

options:
  logging: CLOUD_LOGGING_ONLY
